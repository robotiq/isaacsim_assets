seed: 42
device: cuda:0
num_steps_per_env: 32
init_at_random_ep_len: true
max_iterations: 600
obs_groups:
  actor:
  - policy
  critic:
  - policy
  - critic
clip_actions: null
check_for_nan: true
save_interval: 100
experiment_name: tactile_sphere_pick
run_name: tp20_c3
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: logs/rsl_rl/tactile_sphere_pick/2026-10-25_05-27-50_tp20_c2/model_5387.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.6
    std_type: scalar
    std_range: !!python/tuple
    - 1.0e-06
    - 1000000.0
critic:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: adaptive
  gamma: 0.995
  lam: 0.95
  entropy_coef: 0.003
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  use_mixed_precision: false
  rnd_cfg: null
  symmetry_cfg: null
torch_compile_mode: null
