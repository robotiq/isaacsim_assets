[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotiq_rl"
version = "0.1.0"
description = "Robotiq gripper reinforcement-learning tasks for Isaac Lab"
requires-python = ">=3.12,<3.13"

[project.entry-points."isaaclab.tasks"]
robotiq_rl = "robotiq_rl"

[tool.setuptools.packages.find]
include = ["robotiq_rl*"]
