# Manually-triggered publish of the Robotiq gripper asset to a public Hugging
# Face *dataset*, from which it can be submitted to the NVIDIA SimReady Catalog
# (see ci/simready/submit_to_central.sh and ci/simready/README.md).
#
# Flow:
#   1. `validate` GATE — reuses simready-validate.yml (Robot-Gripper). Publish
#      only runs if this passes. Single source of truth for the pass/fail rule.
#   2. `publish` — builds a self-contained SimReady package that PRESERVES the
#      asset's variants (PhysX / Newton / compliant / tactile), then uploads it to
#      the HF dataset and emits the immutable resolve URL.
#
# Packaging follows NVIDIA's Runtime-Variants + multi-file model rather than
# flattening (which would bake a single solver). Concretely:
#   - stage_package.sh   -> one `simready_usd/` intermediate folder (NP.005),
#   - colocate_package.py -> flatten the FOLDER layout so every layer sits side by
#     side with anchored `./` references (no `../` escaping a layer's dir, which
#     packaging's AA.001 rejects) while keeping all sublayers/payloads/variants,
#   - simready-package --repo <local-folder> -> the WRAPP flow, which validates
#     only the declared root (Package-Candidate pre+post) and writes the package
#     definition + BOM. This needs the `simready-package[publish]` extra (pulls
#     `ovpackage`, which provides `wrapp`); a local folder repo needs no Nucleus.
#
# Requires repo secret HF_TOKEN (a Hugging Face *write* token for the target
# namespace). A public HF dataset (license cc-by-4.0 in its card) must exist or
# be creatable by that token.
#
# NOTE: every step is reproduced locally with the real toolchain, but the wired
# workflow runs in CI for the first time — do a `dry_run: true` dispatch first.
name: hf-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version YYYY.MM.DD_NN. Leave BLANK to auto-derive today's date + next _NN."
        required: false
        default: ""
      dataset:
        description: "HF dataset, <namespace>/<name> (no dots in either)"
        default: Robotiq-Official/simready-assets
      asset_dir:
        description: "Repo-relative asset folder; its basename is the logical asset name"
        default: grippers/Robotiq_2F_85
      root_usd:
        description: "Interface USD filename, relative to asset_dir"
        default: Robotiq_2F_85.usda
      license_id:
        description: "SPDX license id; must match the HF dataset card"
        default: cc-by-4.0
      simready_foundation_ref:
        description: "NVIDIA/simready-foundation commit or tag (packaging spec)"
        default: v2026.07.1
      dry_run:
        description: "Build + package but DO NOT upload to Hugging Face"
        type: boolean
        default: false

jobs:
  # Pass/fail gate. Reuses the exact validation the repo already trusts.
  validate:
    uses: ./.github/workflows/simready-validate.yml
    with:
      asset: ${{ format('{0}/{1}', inputs.asset_dir, inputs.root_usd) }}
      profile: Robot-Gripper
      version: "2.1.0"
      simready_foundation_ref: ${{ inputs.simready_foundation_ref }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DATASET: ${{ inputs.dataset }}
      INPUT_VERSION: ${{ inputs.version }}
      ROOT_USD: ${{ inputs.root_usd }}
      LICENSE_ID: ${{ inputs.license_id }}
    steps:
      - name: Validate dataset name (no dots)
        run: |
          # SimReady requires no dots in namespace or dataset name (keeps the
          # package id unambiguous). Version format is checked in "Resolve version".
          if printf '%s' "$DATASET" | awk -F/ '{exit !($1 ~ /\./ || $2 ~ /\./)}'; then
            echo "::error::HF namespace/dataset must not contain a dot: $DATASET"
            exit 1
          fi

      - name: Check out asset (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          path: asset

      - name: Check out SimReady packaging spec (NVIDIA/simready-foundation)
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/simready-foundation
          ref: ${{ inputs.simready_foundation_ref }}
          path: simready-foundation
          # Only the rule/feature/profile spec is needed; explicit --*-path flags
          # to simready-package mean the large sample_content is not required.
          sparse-checkout: nv_core

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SimReady packager (with publish extra) + HF CLI
        run: |
          python -m pip install --upgrade pip
          # The [publish] extra pulls `ovpackage`, which provides the `wrapp`
          # module the --repo/BOM (root-only validation) flow needs. All public
          # PyPI; no Omniverse/Nucleus install required for a local-folder repo.
          pip install \
            "simready-package[publish]" \
            usd-core==26.8 \
            numpy==2.5.1 \
            huggingface_hub

      - name: Resolve version (auto-derive if blank; refuse to reuse one)
        run: |
          # Existing published versions are tracked as tags on the dataset (NVIDIA
          # pins by commit SHA and ignores tags, so this is a free, reliable
          # registry that doesn't depend on the package-json schema). A blank
          # input auto-derives today's date + the next _NN; a provided value is
          # used verbatim. Either way, an already-published version is rejected.
          python3 - <<'PY'
          import datetime, os, re, sys
          from huggingface_hub import HfApi

          dataset = os.environ["DATASET"]
          inp = (os.environ.get("INPUT_VERSION") or "").strip()
          api = HfApi(token=os.environ.get("HF_TOKEN") or None)
          try:
              tags = [t.name for t in api.list_repo_refs(dataset, repo_type="dataset").tags]
          except Exception as e:
              print(f"::warning::could not list dataset tags ({e}); assuming none")
              tags = []

          fmt = re.compile(r"^\d{4}\.\d{2}\.\d{2}_\d{2}$")
          if inp:
              if not fmt.match(inp):
                  sys.exit(f"::error::version '{inp}' is not in the format YYYY.MM.DD_NN")
              version = inp
          else:
              today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y.%m.%d")
              same_day = [t for t in tags if t.startswith(today + "_")]
              nn = max((int(t.rsplit("_", 1)[-1]) for t in same_day), default=-1) + 1
              version = f"{today}_{nn:02d}"

          if version in tags:
              sys.exit(f"::error::version '{version}' is already published (tag exists). Bump _NN or pick a new version.")

          print(f"Resolved version: {version}")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"VERSION={version}\n")
          PY

      - name: Build the SimReady package (stage -> co-locate -> --repo package)
        run: |
          set -euo pipefail
          CI_DIR="$GITHUB_WORKSPACE/asset/ci/simready"
          LOGICAL="$(basename '${{ inputs.asset_dir }}')"
          ROOT_NAME="sm_${LOGICAL}_01.usd"
          TC="$GITHUB_WORKSPACE/simready-foundation/nv_core/tiers/simready_foundation_tier_core/simready/foundation/tier_core"

          # 1. one intermediate folder (NP.005)
          STAGED=$(bash "$CI_DIR/stage_package.sh" \
            "$GITHUB_WORKSPACE/asset/${{ inputs.asset_dir }}" "$ROOT_USD" "$GITHUB_WORKSPACE/staged")

          # 2. flat, self-contained ./ layout that keeps every layer + variant
          DELIV_ROOT="$GITHUB_WORKSPACE/deliverable"
          LOGICAL_DIR=$(python3 "$CI_DIR/colocate_package.py" \
            --src-root "$STAGED/simready_usd/$ROOT_USD" \
            --out "$DELIV_ROOT" --asset-name "$LOGICAL" \
            --thumbnail "$STAGED/simready_usd/.thumbs/256x256/$ROOT_USD.png" \
            --root-usd-name "$ROOT_NAME")

          # 3. WRAPP package into a local-folder repo (root-only Package-Candidate
          #    pre+post validation; writes the package def + BOM).
          NAME="simready.hf.${DATASET//\//.}.${LOGICAL}"
          REPO="$GITHUB_WORKSPACE/wrapp-repo"
          simready-package \
            --rules-path "$TC/capabilities" \
            --features-path "$TC/features" \
            --profiles-path "$TC/profiles/package_profiles.toml" \
            --name "$NAME" --version "$VERSION" --license "$LICENSE_ID" \
            --root-usd "simready_usd/$ROOT_NAME" \
            --repo "$REPO" "$LOGICAL_DIR"

          PKG_DIR="$REPO/.packages/$NAME/$VERSION"
          PKG_JSON="$PKG_DIR/com.nvidia.simready.packaging.json"
          [ -f "$PKG_JSON" ] || { echo "::error::simready-package produced no $PKG_JSON"; exit 1; }
          # The .wrapp bundle is the archived form; the HF folder ships the
          # unpacked package (def + .metadata/ + simready_usd/), like NVIDIA's
          # on-disk reference packages. Drop the bundle before upload.
          find "$PKG_DIR" -maxdepth 1 -name '*.wrapp' -delete
          echo "PKG_DIR=$PKG_DIR" >> "$GITHUB_ENV"
          echo "LOGICAL=$LOGICAL" >> "$GITHUB_ENV"
          {
            echo "### Package definition"
            echo '```json'; cat "$PKG_JSON"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Hugging Face dataset
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set"; exit 1
          fi
          # Delete patterns are matched relative to path_in_repo, and a leading
          # "./" breaks the match, so pass "$LOGICAL" (no ./) + --delete "*" to
          # replace the folder contents on update (.gitattributes is protected).
          OUT=$(hf upload "$DATASET" "$PKG_DIR" "$LOGICAL" \
            --repo-type dataset --delete "*" 2>&1 | tee /dev/stderr)
          COMMIT_URL=$(printf '%s\n' "$OUT" | grep -oE 'https://huggingface.co/datasets/[^ ]+/commit/[0-9a-f]+' | tail -n1)
          SHA=$(printf '%s' "$COMMIT_URL" | grep -oE '[0-9a-f]{40}$')
          [ -n "$SHA" ] || { echo "::error::could not parse commit SHA from hf upload output"; exit 1; }
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          RESOLVE_URL="https://huggingface.co/datasets/$DATASET/resolve/$SHA/$LOGICAL/com.nvidia.simready.packaging.json"
          printf '%s\n' "$RESOLVE_URL" > "$GITHUB_WORKSPACE/submission-url.txt"
          {
            echo "## ✅ Published to Hugging Face"
            echo ""
            echo "**Dataset:** \`$DATASET\`  "
            echo "**Version:** \`$VERSION\`  "
            echo "**Commit:** \`$SHA\`"
            echo ""
            echo "**Immutable submission URL** (for \`submissions/$DATASET\` in SimReady Central):"
            echo ""
            echo '```'; echo "$RESOLVE_URL"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the published version on the dataset
        if: ${{ !inputs.dry_run }}
        run: |
          # Record the version as a dataset tag so future runs auto-increment _NN
          # and refuse to reuse it. Points at the commit we just created.
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_tag(os.environ["DATASET"], repo_type="dataset",
                         tag=os.environ["VERSION"], revision=os.environ["SHA"])
          print(f"Tagged {os.environ['VERSION']} at {os.environ['SHA']}")
          PY

      - name: Dry-run notice
        if: ${{ inputs.dry_run }}
        run: |
          echo "## 🟡 Dry run — nothing uploaded" >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved version \`$VERSION\` was built + validated but not pushed to Hugging Face." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts (package def + submission URL)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-publish-${{ env.VERSION || github.run_id }}
          path: |
            ${{ env.PKG_DIR }}/com.nvidia.simready.packaging.json
            ${{ env.PKG_DIR }}/.metadata/
            submission-url.txt
          if-no-files-found: ignore
