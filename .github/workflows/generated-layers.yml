# The 2F-85 / 2F-140 physics payload layers are generated by
# devel_helpers/gen_2f_layers.py from one template, so the two grippers cannot drift
# apart. This check fails when a generated layer was edited by hand (or the script was
# changed without regenerating): edit the script and re-run it instead.
name: generated-layers

on:
  push:
    branches: [main]
    paths:
      - 'grippers/Robotiq_2F_85/payloads/**'
      - 'grippers/Robotiq_2F_140/payloads/**'
      - 'devel_helpers/gen_2f_layers.py'
      - '.github/workflows/generated-layers.yml'
  pull_request:
    paths:
      - 'grippers/Robotiq_2F_85/payloads/**'
      - 'grippers/Robotiq_2F_140/payloads/**'
      - 'devel_helpers/gen_2f_layers.py'
      - '.github/workflows/generated-layers.yml'

permissions:
  contents: read

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the 2F physics layers
        run: python3 devel_helpers/gen_2f_layers.py
      - name: Fail if they differ from the committed ones
        run: |
          if ! git diff --exit-code -- grippers/; then
            echo "::error::The 2F physics layers are generated: edit devel_helpers/gen_2f_layers.py and re-run it, do not edit the layers by hand."
            exit 1
          fi
